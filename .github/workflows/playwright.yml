name: Playwright Automation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  api-tests:

    name: API Tests

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Create .env File
        run: |
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> .env
          echo "REQRES_API_KEY=${{ secrets.REQRES_API_KEY }}" >> .env
          echo "UI_BASE_URL=${{ secrets.UI_BASE_URL }}" >> .env

      - name: Run API Tests
        run: npm run test:api

      - name: Upload API Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-report
          path: playwright-report/
          retention-days: 7

  ui-tests:

    name: UI Tests

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Create .env File
        run: |
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> .env
          echo "REQRES_API_KEY=${{ secrets.REQRES_API_KEY }}" >> .env
          echo "UI_BASE_URL=${{ secrets.UI_BASE_URL }}" >> .env

      - name: Run UI Tests
        run: npm run test:ui

      - name: Upload UI Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-report
          path: playwright-report/
          retention-days: 7